<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement annulé - Opportunity Finder</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc,#eef2ff);padding:24px;">
    <div style="max-width:560px;width:100%;background:white;border-radius:24px;padding:42px;text-align:center;box-shadow:0 20px 60px rgba(15,23,42,0.12);border:1px solid #e5e7eb;">
      
      <div style="width:82px;height:82px;border-radius:50%;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:2.4rem;margin:0 auto 24px;">
        ✕
      </div>

      <h1 style="font-size:2rem;font-weight:800;margin-bottom:12px;color:#0f172a;">
        Paiement annulé
      </h1>

      <p style="color:#64748b;font-size:1.05rem;line-height:1.7;margin-bottom:30px;">
        Votre paiement n’a pas été finalisé. Aucun montant n’a été prélevé.
        Vous pouvez réessayer ou retourner à votre tableau de bord.
      </p>

      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
        <a href="pricing.html" class="btn btn-primary">
          Réessayer
        </a>

        <a href="dashboard.html" class="btn btn-secondary">
          Retour au tableau de bord
        </a>
      </div>

      <p style="margin-top:28px;color:#94a3b8;font-size:0.9rem;">
        Besoin d’aide ? Vérifiez votre moyen de paiement ou réessayez plus tard.
      </p>
    </div>
  </div>
</body>
</html>
