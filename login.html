<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <script src="js/theme.js"></script>
  <title>Connexion - Opportunity Finder</title>
  <meta name="description" content="Connectez-vous à votre compte Opportunity Finder pour découvrir des idées de startup.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <style>
    .theme-float {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="theme-float"><button class="theme-toggle-btn" data-theme-toggle aria-label="Passer en mode sombre" title="Mode sombre"><span class="theme-icon">🌙</span></button></div>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="navbar-inner">
        <a href="index.html" class="navbar-logo">
          <img src="logo.png" alt="Opportunity Finder" class="navbar-logo-img">
          <span>Opportunity Finder</span>
        </a>
        
        <div class="navbar-actions">
          <a href="signup.html" class="btn btn-primary">Créer un compte</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Auth Page -->
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="navbar-logo-icon">🔍</div>
          <span>Opportunity Finder</span>
        </a>
        <h1 class="auth-title">Bon Retour</h1>
        <p class="auth-subtitle">Connectez-vous pour continuer à découvrir des opportunités</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Adresse Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="vous@exemple.com"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Mot de Passe</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Entrez votre mot de passe"
            required
            autocomplete="current-password"
          >
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="remember" style="width: 18px; height: 18px;">
            <span style="font-size: 0.9375rem; color: var(--gray-600);">Se souvenir de moi</span>
          </label>
          <a href="#" style="font-size: 0.9375rem; color: var(--primary-600); font-weight: 500;">Mot de passe oublié ?</a>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 8px;">
          Se Connecter
        </button>
      </form>
      
      <div class="auth-footer">
        <p>Vous n'avez pas de compte ? <a href="signup.html">Créez-en un</a></p>
      </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Check if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
